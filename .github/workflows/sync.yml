name: Sync README to All Branches

on:
  push:
    paths:
      - README.md
  workflow_dispatch:

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Sync README.md to All Branches
        run: |
          src_branch="${{ github.ref_name }}"
          for branch in $(git branch -r | grep -vE "${src_branch}|HEAD" | sed 's|origin/||'); do
            git checkout $branch
            git checkout $src_branch -- README.md
            git add README.md
            git commit -m "Sync README.md from $src_branch" || true
            git push origin $branch
          done
