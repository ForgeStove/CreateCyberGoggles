//file:noinspection All
plugins {
    id 'idea'
    id 'eclipse'
    id 'fabric-loom' version '+'
    id "me.modmuss50.mod-publish-plugin" version "+"
}
def platform = "Fabric"
base { archivesName = mod_id }
group = mod_group_id
version = minecraft_version + '-' + mod_version + '+' + platform
repositories {
    maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
    maven { url = "https://mvn.devos.one/releases" } // Porting Lib releases
    maven { url = "https://mvn.devos.one/snapshots" } // Create and several dependencies
    maven { url = "https://maven.tterrag.com" } // Flywheel
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port
    maven {
        url = "https://jitpack.io"
        content { includeGroupAndSubgroups("com.github") }
    } // Fabric ASM for Porting Lib
    maven { url = "https://maven.shedaniel.me" } // Cloth Config API
    maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu
}
configurations.configureEach { resolutionStrategy { force("net.fabricmc:fabric-loader:$fabric_loader_version") } }
dependencies {
    minecraft("com.mojang:minecraft:$minecraft_version")
    mappings(loom.layered {
        it.officialMojangMappings { nameSyntheticMembers = false }
        it.parchment("org.parchmentmc.data:parchment-$minecraft_version:$parchment_version@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$fabric_api_version")
    modImplementation("com.simibubi.create:create-fabric-$minecraft_version:$create_version")
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version")
    modImplementation("com.terraformersmc:modmenu:$modmenu_version")
}
processResources {
    var properties = [minecraft_version: minecraft_version,
                      mod_id           : mod_id,
                      mod_name         : mod_name,
                      mod_display_url  : mod_display_url,
                      mod_issue_url    : mod_issue_url,
                      mod_license      : mod_license,
                      mod_version      : mod_version,
                      mod_authors      : mod_authors,
                      mod_description  : mod_description]
    inputs.properties(properties)
    filesMatching("fabric.mod.json") { expand properties }
}
java { withSourcesJar() }
jar { from("LICENSE"); exclude("${mod_id}-refmap.json") }
loom { accessWidenerPath.set(file("src/main/resources/${mod_id}.accesswidener")) }
publishMods {
    file = jar.archiveFile
    changelog = file("CHANGELOG.md").text
    type = BETA
    version = "$minecraft_version-$mod_version+$platform"
    displayName = "[$platform] $mod_name $mod_version+$minecraft_version"
    modLoaders.addAll("$platform", "Quilt")
    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "TlQAWQCY"
        minecraftVersions.add(minecraft_version)
        requires("create-fabric", "cloth-config")
        optional("modmenu")
    }
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1233804"
        minecraftVersions.add(minecraft_version)
        requires("create-fabric", "cloth-config")
        optional("modmenu")
    }
}
