//file:noinspection SpellCheckingInspection
plugins {
    id 'idea'
    id "eclipse"
    id 'java-library'
    id "maven-publish"
    id 'net.neoforged.moddev' version '+'
    id "me.modmuss50.mod-publish-plugin" version "+"
    id "org.jetbrains.gradle.plugin.idea-ext" version "+"
}
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
def platform = "NeoForge"
version = "$minecraft_version-$mod_version+$platform"
group = mod_group_id
repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
}
neoForge {
    version = neo_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }
//        configureEach {
//            systemProperty 'forge.logging.markers', 'REGISTRIES'
//            logLevel = org.slf4j.event.Level.DEBUG
//        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
dependencies {
    implementation("net.lenni0451:Reflect:+")
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
}
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version    : minecraft_version,
                             mod_id               : mod_id,
                             mod_name             : mod_name,
                             mod_license          : mod_license,
                             mod_version          : mod_version,
                             mod_authors          : mod_authors,
                             mod_display_url      : mod_display_url,
                             mod_issue_tracker_url: mod_issue_tracker_url,
                             mod_description      : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
idea { module { downloadSources = true; downloadJavadoc = true } }
publishMods {
    file = jar.archiveFile
    changelog = file("CHANGELOG.md").text
    type = STABLE
    version = "$minecraft_version-$mod_version+$platform"
    displayName = "[$platform] $mod_name $mod_version+$minecraft_version"
    modLoaders.addAll("$platform")
    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "TlQAWQCY"
        minecraftVersions.add(minecraft_version)
        requires("create")
    }
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1233804"
        minecraftVersions.add(minecraft_version)
        requires("create")
    }
}
